# Local development infrastructure (LocalStack S3 + OCR).
# Database: use Windows PostgreSQL on port 5432 (db_cws) — see scripts/LOCAL-DEV-DATABASE.md
# Docker Postgres was removed to avoid connecting to the wrong empty database.
services:
  localstack:
    container_name: localstack_main
    image: localstack/localstack:3.8.1
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=0
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"

  ocr-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: wtc_ocr_service_dev
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - EASYOCR_GPU=false
      - CONFIDENCE_THRESHOLD=0.35
      - MAX_FILE_SIZE_MB=10
      - DEBUG=false
    restart: unless-stopped

