<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="/pdf-viewer/vendor/web/pdf_viewer.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #525659;
    }
    #outerContainer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #viewerContainer {
      position: absolute;
      inset: 0;
      overflow: auto;
    }
    #errorBox {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    #errorBox.visible { display: flex; }
    #nativeFallback {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #nativeFallback.visible { display: block; }
  </style>
</head>
<body>
  <div id="outerContainer">
    <div id="viewerContainer"></div>
    <iframe id="nativeFallback" title="PDF fallback"></iframe>
    <div id="errorBox"></div>
  </div>
  <script type="module">
    import * as pdfjsLib from "/pdf-viewer/vendor/build/pdf.mjs";
    import { EventBus, PDFViewer } from "/pdf-viewer/vendor/web/pdf_viewer.mjs";

    const PDFJS = "/pdf-viewer/vendor";
    pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS}/build/pdf.worker.mjs`;

    const eventBus = new EventBus();
    const container = document.getElementById("viewerContainer");
    const errorBox = document.getElementById("errorBox");
    const nativeFallback = document.getElementById("nativeFallback");

    const pdfViewer = new PDFViewer({
      container,
      eventBus,
      enableXfa: true,
      textLayerMode: 2,
      annotationMode: 2,
    });

    function notifyParent(payload) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "wtc-pdf-viewer", ...payload }, "*");
      }
    }

    function showError(message) {
      container.style.display = "none";
      nativeFallback.classList.remove("visible");
      errorBox.textContent = message;
      errorBox.classList.add("visible");
      notifyParent({ type: "error", message });
    }

    function showNativeFallback(url) {
      container.style.display = "none";
      errorBox.classList.remove("visible");
      nativeFallback.src = url;
      nativeFallback.classList.add("visible");
      notifyParent({ type: "loaded", numPages: 1, nativeFallback: true });
    }

    async function loadPdf(data) {
      try {
        errorBox.classList.remove("visible");
        nativeFallback.classList.remove("visible");
        nativeFallback.removeAttribute("src");
        container.style.display = "block";

        const bytes = data instanceof Uint8Array
          ? data
          : new Uint8Array(data instanceof ArrayBuffer ? data : data.buffer || data);

        const loadingTask = pdfjsLib.getDocument({
          data: bytes,
          enableXfa: true,
          cMapUrl: `${PDFJS}/cmaps/`,
          cMapPacked: true,
          standardFontDataUrl: `${PDFJS}/standard_fonts/`,
        });

        const pdfDocument = await loadingTask.promise;
        pdfViewer.setDocument(pdfDocument);

        notifyParent({
          type: "loaded",
          numPages: pdfDocument.numPages,
          isPureXfa: pdfDocument.isPureXfa,
        });
      } catch (err) {
        showError(err?.message || "Could not open this PDF.");
      }
    }

    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || msg.target !== "wtc-pdf-viewer") return;

      if (msg.type === "load-bytes" && msg.data) {
        loadPdf(msg.data);
      }

      if (msg.type === "load-url" && msg.url) {
        showNativeFallback(msg.url);
      }

      if (msg.type === "set-scale" && typeof msg.scale === "number") {
        pdfViewer.currentScale = msg.scale;
      }

      if (msg.type === "set-page" && typeof msg.page === "number") {
        pdfViewer.currentPageNumber = msg.page;
      }
    });

    window.addEventListener("error", (event) => {
      showError(event.message || "PDF viewer failed to load.");
    });

    window.addEventListener("unhandledrejection", (event) => {
      showError(event.reason?.message || "PDF viewer failed to load.");
    });

    notifyParent({ type: "ready" });
  </script>
</body>
</html>
