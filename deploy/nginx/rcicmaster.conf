# WayToCanada production nginx — rcicmaster.ca (primary)
# Legacy rcicmaster.com redirects to .ca equivalents.

upstream wtc_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream wtc_public_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream wtc_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream wtc_users {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream wtc_consultant_site {
    server 127.0.0.1:3003;
    keepalive 16;
}

upstream wtc_consultant_dash {
    server 127.0.0.1:3005;
    keepalive 16;
}

# ─── rcicmaster.ca (primary) ───────────────────────────────────────────────

# Consultant marketing site (apex + www when DNS exists)
server {
    listen 80;
    listen [::]:80;
    server_name rcicmaster.ca www.rcicmaster.ca;

    client_max_body_size 64M;
    server_tokens off;

    location /api/ {
        proxy_pass         http://wtc_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
    }

    location ~ ^/(health|up|sanctum)(/|$) {
        proxy_pass         http://wtc_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://wtc_consultant_site;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

