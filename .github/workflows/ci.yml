name: WayToCanada CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend (Laravel) ────────────────────────────────────────────────────
  backend:
    name: Laravel Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_cws_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, curl, libxml, zip, pdo, pgsql, pdo_pgsql, bcmath, intl, fileinfo, gd, tokenizer, openssl
          tools: composer:v2
          coverage: none

      - name: Prepare Laravel writable directories
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache \
            storage/framework/cache \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs
          chmod -R 777 bootstrap/cache storage

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-php82-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-php82-
            composer-

      - name: Install Composer dependencies
        working-directory: backend
        run: |
          COMPOSER_MEMORY_LIMIT=-1 composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-progress \
            --no-scripts

      - name: Create .env for CI
        working-directory: backend
        run: cp .env.ci .env

      - name: Discover packages
        working-directory: backend
        run: php artisan package:discover --ansi

      - name: Wait for Postgres and create test databases
        working-directory: backend
        env:
          PGPASSWORD: secret
        run: |
          for i in $(seq 1 60); do
            if php -r "try { new PDO('pgsql:host=127.0.0.1;port=5433;dbname=db_cws_test', 'postgres', 'secret'); echo 'Postgres ready'; exit(0); } catch (Throwable \$e) { exit(1); }"; then
              break
            fi
            echo "Waiting for Postgres... ($i/60)"
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "Postgres did not become ready in time"
              exit 1
            fi
          done
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'db_lms_test'" | grep -q 1 \
            || psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -c "CREATE DATABASE db_lms_test;" \
            || php -r "try { \$p=new PDO('pgsql:host=127.0.0.1;port=5433;dbname=postgres','postgres','secret'); if(!\$p->query(\"SELECT 1 FROM pg_database WHERE datname='db_lms_test'\")->fetch()){ \$p->exec('CREATE DATABASE db_lms_test'); } echo 'db_lms_test ready'; } catch(Throwable \$e){ fwrite(STDERR,\$e->getMessage()); exit(1);} "

      - name: Run tests
        working-directory: backend
        run: php vendor/bin/phpunit --log-junit test-results.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  # ── Frontend builds ───────────────────────────────────────────────────────
  frontend:
    name: Frontend Build — ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Admin Dashboard
            dir: "frontend/Admins Dashbord"
          - name: Public Users Dashboard
            dir: "frontend/Public users Dashbord"
          - name: Consultant Dashboard
            dir: "frontend/Consultant Dashbord"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ matrix.name }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', matrix.dir), format('{0}/package.json', matrix.dir)) }}
          restore-keys: pnpm-${{ matrix.name }}-

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: pnpm install

      - name: Type-check & Build
        working-directory: ${{ matrix.dir }}
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
