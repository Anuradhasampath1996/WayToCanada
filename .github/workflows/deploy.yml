name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS EC2 (lightersmenia.com)
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "::error::Missing GitHub secret SSH_HOST (EC2 IP e.g. 3.96.187.125)"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "::error::Missing GitHub secret SSH_USER (e.g. github-actions or ubuntu)"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Connect via SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_PATH="/opt/waytocanada"
            echo ">>> Connected to $(hostname)"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: $DEPLOY_PATH is not a git repository. Clone the repo on the server first."
              exit 1
            fi

            cd "$DEPLOY_PATH"
            echo ">>> Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Clearing stale Laravel caches..."
            rm -f backend/bootstrap/cache/*.php

            echo ">>> Ensuring backend .env exists..."
            if [ ! -f backend/.env ]; then
              cp backend/.env.example backend/.env
              sed -i "s/^APP_KEY=.*/APP_KEY=base64:$(openssl rand -base64 32)/" backend/.env
              echo "WARNING: Created backend/.env from example — set production DB/OAuth secrets on the server."
            fi

            echo ">>> Building and starting Docker containers..."
            if [ -f docker-compose.prod.yml ]; then
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            else
              docker compose pull --ignore-pull-failures || true
              docker compose up -d --build --remove-orphans
            fi

            echo ">>> Reloading Nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo ">>> Deploy finished successfully."
            docker compose ps 2>/dev/null || docker compose -f docker-compose.prod.yml ps 2>/dev/null || true
