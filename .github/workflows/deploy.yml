name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS EC2 (git pull + server build)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "::error::Missing GitHub secret SSH_HOST"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "::error::Missing GitHub secret SSH_USER"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Deploy on EC2 (git pull + build + start)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            DEPLOY_PATH="/opt/waytocanada"
            cd "$DEPLOY_PATH"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            DEPLOY_KEY="$HOME/.ssh/github_deploy"
            if [ -f "$DEPLOY_KEY" ]; then
              if [ ! -f ~/.ssh/config ] || ! grep -q "Host github.com" ~/.ssh/config; then
                cat >> ~/.ssh/config << EOF
            Host github.com
              HostName github.com
              User git
              IdentityFile ${DEPLOY_KEY}
              IdentitiesOnly yes
            EOF
                chmod 600 ~/.ssh/config
              fi
              ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            fi
            git remote set-url origin git@github.com:Anuradhasampath1996/WayToCanada.git
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy-on-server.sh
