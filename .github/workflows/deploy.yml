name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build on GH Actions → Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "::error::Missing GitHub secret SSH_HOST (EC2 IP e.g. 3.96.127.94)"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "::error::Missing GitHub secret SSH_USER (e.g. github-actions or ubuntu)"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH for streaming
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build and stream images to EC2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KEY: ~/.ssh/deploy_key
        run: bash deploy/build-and-stream-ci.sh

      - name: Start containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo ">>> Connected to $(hostname)"
            DEPLOY_PATH="/opt/waytocanada"
            cd "$DEPLOY_PATH"

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            DEPLOY_KEY="$HOME/.ssh/github_deploy"
            if [ -f "$DEPLOY_KEY" ]; then
              if [ ! -f ~/.ssh/config ] || ! grep -q "Host github.com" ~/.ssh/config; then
                cat >> ~/.ssh/config << EOF
            Host github.com
              HostName github.com
              User git
              IdentityFile ${DEPLOY_KEY}
              IdentitiesOnly yes
            EOF
                chmod 600 ~/.ssh/config
              fi
              ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            fi
            git remote set-url origin git@github.com:Anuradhasampath1996/WayToCanada.git
            git fetch origin main
            git reset --hard origin/main

            SKIP_IMAGE_LOAD=1 bash deploy/remote-load-and-up.sh
